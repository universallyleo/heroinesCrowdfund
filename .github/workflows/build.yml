name: Build on change to src

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'static/**'
      - 'svelte.config.js'
  # Allow this to be called from other workflows
  workflow_call:
    inputs:
      checkout-ref:
        description: 'Git ref or commit SHA to build'
        required: false
        type: string
        default: ''
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      checkout-ref:
        description: '復旧するコミット（空欄なら選択ブランチの最新。公開時点の main と一致する必要があります）'
        required: false
        type: string
        default: ''

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false

# The following is from SvelteKit recommendation https://kit.svelte.dev/docs/adapter-static
jobs:
  build_site:
    runs-on: ubuntu-latest
    outputs:
      built_sha: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}

      - name: Record built revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: build
        env:
          BASE_PATH: '/${{ github.event.repository.name }}'
        run: bun run build

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v5
        with:
          # this should match the `pages` option in your adapter-static options
          path: 'build/'

  deploy:
    needs: build_site
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Prevent an obsolete revision from replacing the current site
        env:
          GH_TOKEN: ${{ github.token }}
          BUILT_SHA: ${{ needs.build_site.outputs.built_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          current_main=$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$BUILT_SHA" != "$current_main" ]]; then
            echo "::error::This build has been superseded. Rerun the Pages build at current main."
            exit 1
          fi

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
