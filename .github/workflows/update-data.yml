name: Update scraped crowdfunding data

on:
  workflow_dispatch:
    inputs:
      agency:
        description: '更新する事務所'
        required: true
        type: choice
        default: heroines
        options:
          - heroines
          - madsink
      dry_run:
        description: 'Scrape and upload a report without changing the repository'
        required: false
        type: boolean
        default: false
      full_scan:
        description: 'Ignore the checkpoint and scan every listing page'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scrape-data
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    outputs:
      database_changed: ${{ steps.apply.outputs.database_changed || 'false' }}
      progress_changed: ${{ steps.apply.outputs.progress_changed || 'false' }}
      metadata_changed: ${{ steps.apply.outputs.metadata_changed || 'false' }}
      public_data_changed: ${{ steps.apply.outputs.public_data_changed || 'false' }}
      commit_sha: ${{ steps.apply.outputs.commit_sha }}
    env:
      AGENCY: ${{ inputs.agency }}
      OUTPUT_DIR: ${{ runner.temp }}/scrape-${{ inputs.agency }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install scraper dependencies
        run: python -m pip install requests beautifulsoup4

      - name: Run scraper tests
        run: python -m unittest discover -s scrape_data -p 'test_*.py' -v

      - name: Scrape and stage candidates
        run: |
          mkdir -p "$OUTPUT_DIR"
          scan_args=()
          if [[ "${{ inputs.full_scan }}" == "true" ]]; then
            scan_args+=(--full-scan)
          fi
          python scrape_data/scraper.py \
            --agency "$AGENCY" \
            --output-dir "$OUTPUT_DIR" \
            "${scan_args[@]}"

      - name: Summarize scrape coverage
        if: always()
        run: python scrape_data/summarize_report.py "$OUTPUT_DIR"

      - name: Upload scrape report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: scrape-report-${{ inputs.agency }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: ignore

      - name: Apply staged data and push
        id: apply
        if: ${{ success() && !inputs.dry_run }}
        run: |
          python scrape_data/apply_update.py \
            --output-dir "$OUTPUT_DIR" \
            --agency "$AGENCY" \
            --repo-root . --publish \
            --github-output "$GITHUB_OUTPUT"
          echo "Completed application for $AGENCY at $(git rev-parse HEAD). A no-op creates no commit; public changes trigger the rebuild job." >> "$GITHUB_STEP_SUMMARY"

  rebuild:
    if: ${{ needs.scrape.outputs.public_data_changed == 'true' && needs.scrape.outputs.commit_sha != '' }}
    needs: scrape
    uses: ./.github/workflows/build.yml
    with:
      checkout-ref: ${{ needs.scrape.outputs.commit_sha }}
